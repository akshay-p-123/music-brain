[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicbrain"
version = "0.0.1"
description = "Audio -> brain state -> emotion trajectory -> sentence and photo"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "requests",
  "torch",
  "transformers",
  "nibabel",
  "nilearn",
  "soundfile",
]

[tool.setuptools.packages.find]
where = ["src"]
